<title data-i18n="doc_title">Shulker 环境音 - 随机播放</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {

    background-image:

    background-position: 0 0, 16px 16px;
    font-family: 'Courier New', monospace;
    color: #e0e0e0;
    padding: 16px;
  }
  .panel {
    position: relative;
    width: 100%; max-width: 420px;
    background: #3a2f4d;
    border: 4px solid #241c33;
    box-shadow: inset -4px -4px 0 rgba(0,0,0,.35), inset 4px 4px 0 rgba(255,255,255,.08), 0 8px 24px rgba(0,0,0,.5);

  }
  .title {

    color: #d8b4fe; text-shadow: 2px 2px 0 #241c33;

  }
  .subtitle { text-align: center; font-size: 12px; color: #9b8bb4; margin-bottom: 20px; }
  .lang {
    position: absolute; top: 10px; right: 10px;
    font-family: inherit; font-size: 11px; font-weight: bold;
    color: #d8b4fe; background: #2e2440; cursor: pointer;
    border: 2px solid #241c33; padding: 4px 8px;

    appearance: none; -webkit-appearance: none;
  }
  .lang option { background: #2e2440; color: #d8b4fe; }
  .lang:focus { outline: none; }
  .screen {
    background: #12101a;
    border: 3px solid #241c33;
    box-shadow: inset 2px 2px 0 rgba(0,0,0,.6), inset -2px -2px 0 rgba(255,255,255,.05);
    padding: 14px; margin-bottom: 18px; min-height: 76px;
  }
  .status { font-size: 13px; line-height: 1.7; }
  .status .label { color: #6b5f85; }
  .status .val { color: #7ee787; }
  .status .val.playing { color: #ffd76e; }
  .blink { animation: blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .bar {
    margin-top: 8px; height: 10px; background: #241c33;
    border: 2px solid #241c33; box-shadow: inset 1px 1px 0 rgba(0,0,0,.5);
  }
  .bar > div {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, #6d5a8f, #b58ae6);
    transition: width .1s linear;
  }
  .controls { display: flex; gap: 12px; margin-bottom: 18px; }
  .btn {
    flex: 1; padding: 14px 0; font-family: inherit; font-size: 14px; font-weight: bold;
    color: #fff; cursor: pointer; letter-spacing: 1px;
    border: 3px solid #241c33;
    box-shadow: inset -3px -3px 0 rgba(0,0,0,.35), inset 3px 3px 0 rgba(255,255,255,.2);
    text-shadow: 1px 1px 0 rgba(0,0,0,.5);
    transition: transform .05s;
  }
  .btn:active { transform: translateY(2px); box-shadow: inset 3px 3px 0 rgba(0,0,0,.35), inset -3px -3px 0 rgba(255,255,255,.1); }
  .btn:disabled { opacity: .5; cursor: default; }
  .btn.start { background: #4caf50; }
  .btn.manual { background: #1e88e5; }
  .btn.stop  { background: #c62828; }
  .row { display: flex; align-items: center; gap: 12px; margin-bottom: 6px; }
  .row label { font-size: 12px; color: #9b8bb4; white-space: nowrap; }
  input[type=range] { flex: 1; accent-color: #b58ae6; }
  .list { margin-top: 16px; border-top: 2px solid #4a3d63; padding-top: 12px; }
  .list h3 { font-size: 12px; color: #9b8bb4; margin-bottom: 8px; }
  .track {

    background: #2e2440; border-left: 3px solid #6d5a8f;
    color: #8d7fa8; display: flex; justify-content: space-between;
    cursor: pointer;
  }
  .track:not(.now):hover { background: #3a2f4d; color: #b9a9d6; }
  .track.now { border-left-color: #ffd76e; color: #ffd76e; background: #3a2f4d; }
  footer { margin-top: 14px; text-align: center; font-size: 10px; color: #6b5f85; }
</style>

var SUPPORTED = ["zh", "es", "en", "ar", "ru", "fr"];
var lang = (function(){
  try {
    var saved = localStorage.getItem("shulker_lang");
    if (SUPPORTED.indexOf(saved) >= 0) return saved;
  } catch(e){}
  var n = (navigator.language || "").toLowerCase();
  if (n.indexOf("zh") === 0) return "zh";
  if (n.indexOf("es") === 0) return "es";
  if (n.indexOf("ar") === 0) return "ar";
  if (n.indexOf("ru") === 0) return "ru";
  if (n.indexOf("fr") === 0) return "fr";
  return "en";
})();

function t(key){
  return (I18N[lang] && I18N[lang][key]) || I18N.zh[key] || key;
}

function applyLang(){
  document.documentElement.lang = lang;
  document.title = t("doc_title");
  var nodes = document.querySelectorAll("[data-i18n]");
  for (var i = 0; i < nodes.length; i++) {
    nodes[i].textContent = t(nodes[i].getAttribute("data-i18n"));
  }
  el("langSelect").value = lang;
  // Refresh dynamic status text
  if (stateMode === "playing") {
    el("state").textContent = t(stateManual ? "playing_manual" : "playing");
  } else if (stateMode === "idle") {
    el("state").textContent = t("idle").replace("{s}", stateIdleSec);
  } else {
    el("state").textContent = t("stopped");
  }
}

var audio = new Audio();
audio.preload = "auto";
var running = false, timer = null, lastIndex = -1, playCount = 0;
var isPlaying = false; // True whenever audio is playing (scheduled or manual)
// Status text mode: stopped / playing / idle (for re-render after language change)
var stateMode = "stopped", stateManual = false, stateIdleSec = "0";

var el = function(id){ return document.getElementById(id); };
var tracksBox = el("tracks");
SOUNDS.forEach(function(s, i){
  var d = document.createElement("div");
  d.className = "track"; d.id = "track" + i;
  d.innerHTML = "<span>" + (i + 1) + ". " + s.name + "</span><span>ogg</span>";
  d.addEventListener("click", function(){ playFromList(i); });
  tracksBox.appendChild(d);
});

function fmtTime(){
  var d = new Date();
  function p(n){ return (n < 10 ? "0" : "") + n; }
  return p(d.getHours()) + ":" + p(d.getMinutes()) + ":" + p(d.getSeconds());
}

function pick(){
  // Like MC: fully random, but avoid repeating the previous one
  var i;
  do { i = Math.floor(Math.random() * SOUNDS.length); }
  while (SOUNDS.length > 1 && i === lastIndex && Math.random() < 0.8);
  return i;
}

function updateNow(idx){
  SOUNDS.forEach(function(_, i){
    el("track" + i).className = "track" + (i === idx ? " now" : "");
  });
}

function schedule(){
  if (!running) return;
  var base = parseInt(el("gap").value, 10);
  var delay = base * 1000 * (0.6 + Math.random() * 0.8); // ±40% jitter on interval
  stateMode = "idle";
  stateIdleSec = (delay / 1000).toFixed(1);
  el("state").textContent = t("idle").replace("{s}", stateIdleSec);
  el("state").className = "val";
  timer = setTimeout(playNext, delay);
}

function playOne(manual, forcedIndex){
  // Global mutex: if audio is already playing (any trigger), ignore
  if (isPlaying) return false;
  var idx = (typeof forcedIndex === "number") ? forcedIndex : pick();
  lastIndex = idx;
  updateNow(idx); // Highlight the current track
  audio.src = SOUNDS[idx].data;
  audio.volume = el("vol").value / 100;
  isPlaying = true;
  audio.play().catch(function(){ isPlaying = false; });
  playCount++;
  el("count").textContent = playCount;
  el("last").textContent = SOUNDS[idx].name + "  @" + fmtTime();
  stateMode = "playing"; stateManual = !!manual;
  el("state").textContent = t(manual ? "playing_manual" : "playing");
  el("state").className = "val playing";
  el("cursor").style.display = "inline";
  return true;
}

function playNext(){
  if (!running) return;
  playOne(false);
}

function playFromList(idx){
  // Same behavior as the manual "Play one" button, but for a specific track
  if (isPlaying) return;      // Already playing; ignore
  clearTimeout(timer);        // Cancel pending timer so it won't interrupt
  playOne(true, idx);         // ended event restores state: if running, re-schedule
}

function barLoop(){
  requestAnimationFrame(function(){
    el("bar").style.width = (running && audio.duration ? (audio.currentTime / audio.duration) * 100 : 0) + "%";
    if (running) barLoop(); else el("bar").style.width = "0%";
  });
}

audio.addEventListener("ended", function(){
  isPlaying = false;
  el("cursor").style.display = "none";
  // Keep highlight after playback ends; do not auto-clear
  if (running) schedule();
  else { stateMode = "stopped"; el("state").textContent = t("stopped"); el("state").className = "val"; }
});

audio.addEventListener("error", function(){ isPlaying = false; });

el("btnStart").addEventListener("click", function(){
  if (running) return;
  running = true;
  el("btnStart").disabled = true;
  el("btnStop").disabled = false;
  barLoop();
  playNext(); // Play once immediately on start, then use random intervals
});

el("btnStop").addEventListener("click", function(){
  running = false;
  clearTimeout(timer);
  isPlaying = false;
  audio.pause();
  audio.currentTime = 0;
  el("btnStart").disabled = false;
  el("btnStop").disabled = true;
  stateMode = "stopped";
  el("state").textContent = t("stopped");
  el("state").className = "val";
  el("cursor").style.display = "none";
  updateNow(-1); // Only clear highlight on manual stop
});

el("btnManual").addEventListener("click", function(){
  if (isPlaying) return;      // Already playing (scheduled or manual); ignore
  clearTimeout(timer);        // Cancel pending timer to avoid re-trigger during manual playback
  playOne(true);              // ended event restores state: if running, re-schedule randomly
});

el("vol").addEventListener("input", function(){
  el("volTxt").textContent = this.value + "%";
  audio.volume = this.value / 100;
});

el("gap").addEventListener("input", function(){
  el("gapTxt").textContent = this.value + "s±40%";
});

el("langSelect").addEventListener("change", function(){
  lang = this.value;
  try { localStorage.setItem("shulker_lang", lang); } catch(e){}
  applyLang();
});

// Spacebar shortcut to toggle playback
document.addEventListener("keydown", function(e){
  if (e.code === "Space") {
    e.preventDefault();
    running ? el("btnStop").click() : el("btnStart").click();
  }
});

applyLang(); // Initialize UI language
</script>
</body>
</html>
